[project]
name = "aisurgeon-decentralised"
version = "0.1.0"
description = "Local-first provenance-preserving hybrid retrieval research prototype"
readme = "README.md"
authors = [
    { name = "AISurgeon Study Team" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.17.0",
    "jsonschema>=4.25.1",
    "openpyxl>=3.1.5",
    "openai>=3.0.0",
    "psutil>=7.0.0",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]

[project.scripts]
aisurgeon-decentralised = "aisurgeon_decentralised:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Archive gate: syntax/import correctness, undefined/unused names and import order.
# More opinionated refactors remain reviewable instead of changing frozen logic.
select = ["E4", "E7", "E9", "F", "I"]
